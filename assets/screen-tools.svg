<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 820" width="400" height="820" fill="none">
  <defs>
    <linearGradient id="toolsPhoneBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="100%" stop-color="#0D131F"/>
    </linearGradient>
    <linearGradient id="toolsBrandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
  </defs>

  <!-- Device Outer Frame -->
  <rect width="400" height="820" rx="44" fill="#000000" stroke="#1F2937" stroke-width="4"/>
  <rect x="8" y="8" width="384" height="804" rx="38" fill="url(#toolsPhoneBg)"/>

  <!-- Dynamic Island -->
  <rect x="150" y="18" width="100" height="24" rx="12" fill="#000000"/>
  <circle cx="232" cy="30" r="5" fill="#1F2937"/>

  <!-- Status Bar -->
  <text x="32" y="34" font-family="sans-serif" font-size="12" font-weight="600" fill="#E5E7EB">09:41</text>
  <g transform="translate(330, 24)">
    <path d="M0,8 A8,8 0 0,1 12,0 A8,8 0 0,1 24,8" stroke="#E5E7EB" stroke-width="2" fill="none"/>
    <rect x="30" y="2" width="20" height="10" rx="2" stroke="#E5E7EB" stroke-width="1.5" fill="none"/>
    <rect x="32" y="4" width="12" height="6" rx="1" fill="#10B981"/>
  </g>

  <!-- Tools Top Bar -->
  <g transform="translate(24, 60)">
    <text x="0" y="24" font-family="sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">Tools</text>
    <text x="0" y="42" font-family="sans-serif" font-size="12" font-weight="500" fill="#9CA3AF">Kenali fitur yang tersedia di Morph.</text>
  </g>

  <!-- Section: Conversion Tools -->
  <g transform="translate(24, 125)">
    <text font-family="sans-serif" font-size="13" font-weight="700" fill="#818CF8">CONVERSION TOOLS</text>
    <text y="16" font-family="sans-serif" font-size="11" font-weight="400" fill="#64748B">Alat konversi berkas bawaan Morph.</text>
  </g>

  <!-- Tools Cards Scroll View Area -->
  <g transform="translate(20, 155)">
    <!-- Card 1: Video Conversion -->
    <g transform="translate(0, 0)">
      <rect width="360" height="92" rx="18" fill="#131C2E" stroke="#1F2937" stroke-width="1"/>
      <rect x="14" y="14" width="36" height="36" rx="10" fill="#6366F1" opacity="0.2"/>
      <text x="23" y="38" font-family="sans-serif" font-size="16" fill="#818CF8">🎬</text>

      <text x="60" y="30" font-family="sans-serif" font-size="14" font-weight="700" fill="#F3F4F6">Video Conversion</text>
      <text x="60" y="46" font-family="sans-serif" font-size="11" font-weight="400" fill="#94A3B8">Stream copy cepat tanpa encoding ulang jika kompatibel.</text>
      
      <rect x="60" y="56" width="270" height="22" rx="6" fill="#1E1B4B"/>
      <text x="68" y="71" font-family="sans-serif" font-size="10" font-weight="600" fill="#A5B4FC">MKV · MP4 · MOV → MP4 · MOV · MKV</text>
    </g>

    <!-- Card 2: PDF Toolkit -->
    <g transform="translate(0, 102)">
      <rect width="360" height="92" rx="18" fill="#131C2E" stroke="#1F2937" stroke-width="1"/>
      <rect x="14" y="14" width="36" height="36" rx="10" fill="#EF4444" opacity="0.2"/>
      <text x="23" y="38" font-family="sans-serif" font-size="16" fill="#EF4444">📄</text>

      <text x="60" y="30" font-family="sans-serif" font-size="14" font-weight="700" fill="#F3F4F6">PDF Toolkit</text>
      <text x="60" y="46" font-family="sans-serif" font-size="11" font-weight="400" fill="#94A3B8">Kompresi cerdas PDF & konversi halaman jadi gambar.</text>
      
      <rect x="60" y="56" width="270" height="22" rx="6" fill="#450A0A"/>
      <text x="68" y="71" font-family="sans-serif" font-size="10" font-weight="600" fill="#FCA5A5">PDF · JPG · PNG · WEBP → PDF · PNG · JPG</text>
    </g>

    <!-- Card 3: Audio Extraction -->
    <g transform="translate(0, 204)">
      <rect width="360" height="92" rx="18" fill="#131C2E" stroke="#1F2937" stroke-width="1"/>
      <rect x="14" y="14" width="36" height="36" rx="10" fill="#EC4899" opacity="0.2"/>
      <text x="23" y="38" font-family="sans-serif" font-size="16" fill="#EC4899">🎵</text>

      <text x="60" y="30" font-family="sans-serif" font-size="14" font-weight="700" fill="#F3F4F6">Audio Extraction</text>
      <text x="60" y="46" font-family="sans-serif" font-size="11" font-weight="400" fill="#94A3B8">Ekstrak audio dari video ke MP3, FLAC, WAV, OPUS.</text>
      
      <rect x="60" y="56" width="280" height="22" rx="6" fill="#4A044E"/>
      <text x="68" y="71" font-family="sans-serif" font-size="9.5" font-weight="600" fill="#F472B6">MP4 · MKV → MP3 · M4A · WAV · FLAC · OPUS</text>
    </g>

    <!-- Card 4: SVG Vector Conversion -->
    <g transform="translate(0, 306)">
      <rect width="360" height="92" rx="18" fill="#131C2E" stroke="#1F2937" stroke-width="1"/>
      <rect x="14" y="14" width="36" height="36" rx="10" fill="#10B981" opacity="0.2"/>
      <text x="23" y="38" font-family="sans-serif" font-size="16" fill="#10B981">✨</text>

      <text x="60" y="30" font-family="sans-serif" font-size="14" font-weight="700" fill="#F3F4F6">SVG Vector Rasterizer</text>
      <text x="60" y="46" font-family="sans-serif" font-size="11" font-weight="400" fill="#94A3B8">Ubah file vektor SVG ke PNG transparan dengan AndroidSVG.</text>
      
      <rect x="60" y="56" width="250" height="22" rx="6" fill="#064E3B"/>
      <text x="68" y="71" font-family="sans-serif" font-size="10" font-weight="600" fill="#6EE7B7">SVG → PNG · JPG · WEBP</text>
    </g>

    <!-- Card 5: EPUB Book Extractor -->
    <g transform="translate(0, 408)">
      <rect width="360" height="92" rx="18" fill="#131C2E" stroke="#1F2937" stroke-width="1"/>
      <rect x="14" y="14" width="36" height="36" rx="10" fill="#F59E0B" opacity="0.2"/>
      <text x="23" y="38" font-family="sans-serif" font-size="16" fill="#F59E0B">📖</text>

      <text x="60" y="30" font-family="sans-serif" font-size="14" font-weight="700" fill="#F3F4F6">EPUB Text Extractor</text>
      <text x="60" y="46" font-family="sans-serif" font-size="11" font-weight="400" fill="#94A3B8">Ekstrak urutan bab OPF buku digital jadi teks ringan.</text>
      
      <rect x="60" y="56" width="200" height="22" rx="6" fill="#451A03"/>
      <text x="68" y="71" font-family="sans-serif" font-size="10" font-weight="600" fill="#FCD34D">EPUB → TXT</text>
    </g>

    <!-- Card 6: Share-to-Morph Info Card -->
    <g transform="translate(0, 510)">
      <rect width="360" height="68" rx="16" fill="#182234" stroke="#6366F1" stroke-width="1.2"/>
      <rect x="14" y="14" width="40" height="40" rx="12" fill="#312E81"/>
      <text x="25" y="40" font-family="sans-serif" font-size="18" fill="#818CF8">↗</text>
      
      <text x="66" y="32" font-family="sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Share to Morph (System Integration)</text>
      <text x="66" y="48" font-family="sans-serif" font-size="11" font-weight="400" fill="#94A3B8">Pilih berkas dari Galeri / WhatsApp lalu Bagikan ke Morph</text>
    </g>
  </g>

  <!-- Bottom Navigation Bar (Material 3 - Tools Active) -->
  <g transform="translate(0, 745)">
    <rect width="400" height="75" fill="#0B0F19" stroke="#1F2937" stroke-width="1"/>
    
    <!-- Tab 1: Beranda -->
    <g transform="translate(60, 16)">
      <path d="M13,18 L13,11 L20,6 L27,11 L27,18 Z" stroke="#6B7280" stroke-width="2" fill="none"/>
      <text x="20" y="38" font-family="sans-serif" font-size="10" font-weight="500" fill="#6B7280" text-anchor="middle">Beranda</text>
    </g>

    <!-- Tab 2: Tools (Active) -->
    <g transform="translate(180, 16)">
      <circle cx="20" cy="12" r="16" fill="#1E1B4B"/>
      <path d="M14,8 L20,14 L26,8 M16,16 L12,20 L20,28 L28,20 L24,16" stroke="#818CF8" stroke-width="2" fill="none"/>
      <text x="20" y="38" font-family="sans-serif" font-size="10" font-weight="700" fill="#818CF8" text-anchor="middle">Tools</text>
    </g>

    <!-- Tab 3: Pengaturan -->
    <g transform="translate(300, 16)">
      <circle cx="20" cy="14" r="7" stroke="#6B7280" stroke-width="2" fill="none"/>
      <text x="20" y="38" font-family="sans-serif" font-size="10" font-weight="500" fill="#6B7280" text-anchor="middle">Pengaturan</text>
    </g>
  </g>
</svg>