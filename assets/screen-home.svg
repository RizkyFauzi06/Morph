<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 820" width="400" height="820" fill="none">
  <defs>
    <linearGradient id="phoneBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="100%" stop-color="#0D131F"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#DB2777"/>
    </linearGradient>
    <linearGradient id="progressGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Device Outer Frame -->
  <rect width="400" height="820" rx="44" fill="#000000" stroke="#1F2937" stroke-width="4"/>
  <rect x="8" y="8" width="384" height="804" rx="38" fill="url(#phoneBg)"/>

  <!-- Dynamic Island / Camera Punch Hole -->
  <rect x="150" y="18" width="100" height="24" rx="12" fill="#000000"/>
  <circle cx="232" cy="30" r="5" fill="#1F2937"/>

  <!-- Status Bar (Time & Icons) -->
  <text x="32" y="34" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#E5E7EB">09:41</text>
  <g transform="translate(330, 24)">
    <!-- Battery / Wifi / Signal -->
    <path d="M0,8 A8,8 0 0,1 12,0 A8,8 0 0,1 24,8" stroke="#E5E7EB" stroke-width="2" fill="none"/>
    <rect x="30" y="2" width="20" height="10" rx="2" stroke="#E5E7EB" stroke-width="1.5" fill="none"/>
    <rect x="32" y="4" width="12" height="6" rx="1" fill="#10B981"/>
  </g>

  <!-- Top Hero Header -->
  <g transform="translate(24, 60)">
    <!-- Morph Logo Icon -->
    <rect width="42" height="42" rx="13" fill="url(#brandGrad)"/>
    <path d="M21,0 h11 c5,0 10,5 10,10 v11 c0,0 -10,0 -21,-10 c-2,-2 0,-11 0,-11 z" fill="url(#pinkGrad)"/>
    <path d="M12,31 L12,15 L21,24 L30,15 L30,31" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <text x="54" y="24" font-family="sans-serif" font-size="20" font-weight="800" fill="#F3F4F6">Morph</text>
    <text x="54" y="38" font-family="sans-serif" font-size="11" font-weight="500" fill="#9CA3AF">Universal File Transformer</text>

    <!-- Badge Total Files -->
    <rect x="270" y="8" width="82" height="26" rx="13" fill="#1E1B4B" stroke="#6366F1" stroke-width="1"/>
    <text x="282" y="25" font-family="sans-serif" font-size="11" font-weight="700" fill="#818CF8">4 Berkas</text>
  </g>

  <!-- Active Conversion Banner (PBI 8.3 & 8.9) -->
  <g transform="translate(20, 120)">
    <rect width="360" height="125" rx="20" fill="#182234" stroke="#6366F1" stroke-width="1.5" filter="url(#cardShadow)"/>
    
    <!-- Header with indicator dot -->
    <circle cx="20" cy="24" r="5" fill="#6366F1"/>
    <text x="32" y="28" font-family="sans-serif" font-size="12" font-weight="700" fill="#A5B4FC">MENGONVERSI (2/3)</text>
    <text x="290" y="28" font-family="sans-serif" font-size="13" font-weight="800" fill="#818CF8">68%</text>

    <!-- Filename and step detail -->
    <text x="20" y="52" font-family="sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">recording_meeting.m4a → MP3</text>
    <text x="20" y="70" font-family="sans-serif" font-size="11" font-weight="400" fill="#94A3B8">Ekstraksi audio stream via FFmpegKit (High Q)...</text>

    <!-- Progress Bar -->
    <rect x="20" y="84" width="320" height="8" rx="4" fill="#1F2937"/>
    <rect x="20" y="84" width="218" height="8" rx="4" fill="url(#progressGrad)"/>

    <!-- Cancel button link -->
    <text x="295" y="110" font-family="sans-serif" font-size="11" font-weight="700" fill="#EF4444">Batalkan</text>
  </g>

  <!-- Quick Pick Drop Zone Card -->
  <g transform="translate(20, 260)">
    <rect width="360" height="80" rx="20" fill="#131C2E" stroke="#6366F1" stroke-width="1.2" stroke-dasharray="6 4"/>
    <rect x="18" y="16" width="48" height="48" rx="14" fill="#312E81"/>
    <text x="35" y="46" font-family="sans-serif" font-size="24" font-weight="600" fill="#818CF8">+</text>
    
    <text x="80" y="38" font-family="sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Pilih File Baru</text>
    <text x="80" y="54" font-family="sans-serif" font-size="11" font-weight="400" fill="#94A3B8">Ketuk untuk konversi Video, Audio, Gambar, PDF</text>
  </g>

  <!-- Category Filter Chips Row -->
  <g transform="translate(20, 360)">
    <!-- Active Chip: Semua -->
    <rect width="70" height="32" rx="16" fill="#6366F1"/>
    <text x="16" y="21" font-family="sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Semua</text>

    <!-- Inactive Chip: Video -->
    <rect x="78" width="65" height="32" rx="16" fill="#182234" stroke="#374151" stroke-width="1"/>
    <text x="94" y="21" font-family="sans-serif" font-size="12" font-weight="500" fill="#9CA3AF">Video</text>

    <!-- Inactive Chip: Audio -->
    <rect x="151" width="65" height="32" rx="16" fill="#182234" stroke="#374151" stroke-width="1"/>
    <text x="167" y="21" font-family="sans-serif" font-size="12" font-weight="500" fill="#9CA3AF">Audio</text>

    <!-- Inactive Chip: Gambar -->
    <rect x="224" width="75" height="32" rx="16" fill="#182234" stroke="#374151" stroke-width="1"/>
    <text x="236" y="21" font-family="sans-serif" font-size="12" font-weight="500" fill="#9CA3AF">Gambar</text>

    <!-- Inactive Chip: Dokumen -->
    <rect x="307" width="73" height="32" rx="16" fill="#182234" stroke="#374151" stroke-width="1"/>
    <text x="315" y="21" font-family="sans-serif" font-size="12" font-weight="500" fill="#9CA3AF">Dokumen</text>
  </g>

  <!-- Section Title -->
  <g transform="translate(24, 415)">
    <text font-family="sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Riwayat File Terkonversi</text>
    <text x="300" y="2" font-family="sans-serif" font-size="11" font-weight="500" fill="#64748B">4 ditampilkan</text>
  </g>

  <!-- Converted History List -->
  <g transform="translate(20, 430)">
    <!-- Item 1: MP4 Video -->
    <g transform="translate(0, 0)">
      <rect width="360" height="68" rx="16" fill="#111827" stroke="#1F2937" stroke-width="1"/>
      <rect x="14" y="14" width="40" height="40" rx="10" fill="#7C3AED" opacity="0.2"/>
      <text x="21" y="38" font-family="sans-serif" font-size="11" font-weight="800" fill="#A78BFA">MP4</text>
      
      <text x="66" y="32" font-family="sans-serif" font-size="13" font-weight="600" fill="#F3F4F6">cinematic_reel_4k.mp4</text>
      <text x="66" y="48" font-family="sans-serif" font-size="11" font-weight="400" fill="#6B7280">24.5 MB · 1080p · Baru saja</text>
      
      <text x="300" y="38" font-family="sans-serif" font-size="16" fill="#818CF8">↗</text>
      <text x="330" y="38" font-family="sans-serif" font-size="14" fill="#6B7280">⋮</text>
    </g>

    <!-- Item 2: PDF Document -->
    <g transform="translate(0, 78)">
      <rect width="360" height="68" rx="16" fill="#111827" stroke="#1F2937" stroke-width="1"/>
      <rect x="14" y="14" width="40" height="40" rx="10" fill="#DC2626" opacity="0.2"/>
      <text x="22" y="38" font-family="sans-serif" font-size="11" font-weight="800" fill="#EF4444">PDF</text>
      
      <text x="66" y="32" font-family="sans-serif" font-size="13" font-weight="600" fill="#F3F4F6">Sprint_Report_Final.pdf</text>
      <text x="66" y="48" font-family="sans-serif" font-size="11" font-weight="400" fill="#6B7280">3.2 MB · 12 Halaman · 10:15</text>
      
      <text x="300" y="38" font-family="sans-serif" font-size="16" fill="#818CF8">↗</text>
      <text x="330" y="38" font-family="sans-serif" font-size="14" fill="#6B7280">⋮</text>
    </g>

    <!-- Item 3: PNG Vector Render -->
    <g transform="translate(0, 156)">
      <rect width="360" height="68" rx="16" fill="#111827" stroke="#1F2937" stroke-width="1"/>
      <rect x="14" y="14" width="40" height="40" rx="10" fill="#059669" opacity="0.2"/>
      <text x="21" y="38" font-family="sans-serif" font-size="11" font-weight="800" fill="#34D399">PNG</text>
      
      <text x="66" y="32" font-family="sans-serif" font-size="13" font-weight="600" fill="#F3F4F6">brand_logo_vector.png</text>
      <text x="66" y="48" font-family="sans-serif" font-size="11" font-weight="400" fill="#6B7280">512 KB · Transparent Alpha · Kemarin</text>
      
      <text x="300" y="38" font-family="sans-serif" font-size="16" fill="#818CF8">↗</text>
      <text x="330" y="38" font-family="sans-serif" font-size="14" fill="#6B7280">⋮</text>
    </g>

    <!-- Item 4: TXT Extracted from EPUB -->
    <g transform="translate(0, 234)">
      <rect width="360" height="68" rx="16" fill="#111827" stroke="#1F2937" stroke-width="1"/>
      <rect x="14" y="14" width="40" height="40" rx="10" fill="#D97706" opacity="0.2"/>
      <text x="22" y="38" font-family="sans-serif" font-size="11" font-weight="800" fill="#FBBF24">TXT</text>
      
      <text x="66" y="32" font-family="sans-serif" font-size="13" font-weight="600" fill="#F3F4F6">Atomic_Habits_Book.txt</text>
      <text x="66" y="48" font-family="sans-serif" font-size="11" font-weight="400" fill="#6B7280">680 KB · Ekstraksi Bab Lengkap · 08 Nov</text>
      
      <text x="300" y="38" font-family="sans-serif" font-size="16" fill="#818CF8">↗</text>
      <text x="330" y="38" font-family="sans-serif" font-size="14" fill="#6B7280">⋮</text>
    </g>
  </g>

  <!-- Bottom Navigation Bar (Material 3) -->
  <g transform="translate(0, 745)">
    <rect width="400" height="75" fill="#0B0F19" stroke="#1F2937" stroke-width="1"/>
    
    <!-- Tab 1: Beranda (Active) -->
    <g transform="translate(60, 16)">
      <circle cx="20" cy="12" r="16" fill="#1E1B4B"/>
      <path d="M13,18 L13,11 L20,6 L27,11 L27,18 Z" stroke="#818CF8" stroke-width="2" fill="none"/>
      <text x="20" y="38" font-family="sans-serif" font-size="10" font-weight="700" fill="#818CF8" text-anchor="middle">Beranda</text>
    </g>

    <!-- Tab 2: Tools -->
    <g transform="translate(180, 16)">
      <path d="M14,8 L20,14 L26,8 M16,16 L12,20 L20,28 L28,20 L24,16" stroke="#6B7280" stroke-width="2" fill="none"/>
      <text x="20" y="38" font-family="sans-serif" font-size="10" font-weight="500" fill="#6B7280" text-anchor="middle">Tools</text>
    </g>

    <!-- Tab 3: Pengaturan -->
    <g transform="translate(300, 16)">
      <circle cx="20" cy="14" r="7" stroke="#6B7280" stroke-width="2" fill="none"/>
      <text x="20" y="38" font-family="sans-serif" font-size="10" font-weight="500" fill="#6B7280" text-anchor="middle">Pengaturan</text>
    </g>
  </g>
</svg>