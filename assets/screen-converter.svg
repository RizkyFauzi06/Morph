<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 820" width="400" height="820" fill="none">
  <defs>
    <linearGradient id="phoneBgDim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#05070D"/>
      <stop offset="100%" stop-color="#080C14"/>
    </linearGradient>
    <linearGradient id="sheetBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0B0F19"/>
    </linearGradient>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <filter id="sheetShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="-8" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Device Outer Frame -->
  <rect width="400" height="820" rx="44" fill="#000000" stroke="#1F2937" stroke-width="4"/>
  <rect x="8" y="8" width="384" height="804" rx="38" fill="url(#phoneBgDim)"/>

  <!-- Dimmed Background Content (Simulating Home Screen underneath) -->
  <g opacity="0.25">
    <rect x="24" y="60" width="42" height="42" rx="13" fill="#6366F1"/>
    <text x="78" y="85" font-family="sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">Morph</text>
    <rect x="20" y="120" width="360" height="125" rx="20" fill="#182234"/>
    <rect x="20" y="260" width="360" height="80" rx="20" fill="#131C2E"/>
  </g>

  <!-- Bottom Sheet Overlay Container -->
  <g transform="translate(0, 240)">
    <!-- Sheet background with rounded top corners -->
    <path d="M8,32 Q8,0 40,0 L360,0 Q392,0 392,32 L392,572 L8,572 Z" fill="url(#sheetBg)" stroke="#374151" stroke-width="1.5" filter="url(#sheetShadow)"/>

    <!-- Bottom Sheet Drag Handle -->
    <rect x="175" y="12" width="50" height="5" rx="2.5" fill="#4B5563"/>

    <!-- Sheet Header -->
    <g transform="translate(24, 38)">
      <text font-family="sans-serif" font-size="18" font-weight="800" fill="#FFFFFF">Konfigurasi Konversi Batch</text>
      <text y="22" font-family="sans-serif" font-size="12" font-weight="500" fill="#9CA3AF">3 berkas terpilih dalam 2 kelompok format • 14.2 MB</text>
    </g>

    <!-- Group 1: Gambar PNG (2 files) -->
    <g transform="translate(20, 95)">
      <rect width="360" height="120" rx="16" fill="#182234" stroke="#374151" stroke-width="1"/>
      
      <!-- Group label & count badge -->
      <text x="16" y="28" font-family="sans-serif" font-size="13" font-weight="700" fill="#E5E7EB">Format Sumber: PNG (2 berkas)</text>
      <rect x="260" y="14" width="85" height="20" rx="10" fill="#312E81"/>
      <text x="272" y="28" font-family="sans-serif" font-size="10" font-weight="700" fill="#818CF8">Gambar Raster</text>

      <text x="16" y="52" font-family="sans-serif" font-size="11" font-weight="500" fill="#9CA3AF">Pilih format target konversi:</text>

      <!-- Target Format Selection Chips -->
      <g transform="translate(16, 64)">
        <!-- Selected: PDF -->
        <rect width="68" height="34" rx="10" fill="#6366F1"/>
        <text x="34" y="21" font-family="sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">✓ PDF</text>

        <!-- Unselected: WEBP -->
        <rect x="76" width="68" height="34" rx="10" fill="#1F2937" stroke="#374151" stroke-width="1"/>
        <text x="110" y="21" font-family="sans-serif" font-size="12" font-weight="500" fill="#D1D5DB" text-anchor="middle">WEBP</text>

        <!-- Unselected: JPG -->
        <rect x="152" width="64" height="34" rx="10" fill="#1F2937" stroke="#374151" stroke-width="1"/>
        <text x="184" y="21" font-family="sans-serif" font-size="12" font-weight="500" fill="#D1D5DB" text-anchor="middle">JPG</text>

        <!-- Unselected: BMP -->
        <rect x="224" width="64" height="34" rx="10" fill="#1F2937" stroke="#374151" stroke-width="1"/>
        <text x="256" y="21" font-family="sans-serif" font-size="12" font-weight="500" fill="#D1D5DB" text-anchor="middle">BMP</text>
      </g>
    </g>

    <!-- Group 2: Audio FLAC (1 file) -->
    <g transform="translate(20, 230)">
      <rect width="360" height="120" rx="16" fill="#182234" stroke="#374151" stroke-width="1"/>
      
      <!-- Group label & count badge -->
      <text x="16" y="28" font-family="sans-serif" font-size="13" font-weight="700" fill="#E5E7EB">Format Sumber: FLAC (1 berkas)</text>
      <rect x="270" y="14" width="75" height="20" rx="10" fill="#1E1B4B"/>
      <text x="282" y="28" font-family="sans-serif" font-size="10" font-weight="700" fill="#C084FC">Audio Hi-Fi</text>

      <text x="16" y="52" font-family="sans-serif" font-size="11" font-weight="500" fill="#9CA3AF">Pilih format target konversi:</text>

      <!-- Target Format Selection Chips -->
      <g transform="translate(16, 64)">
        <!-- Selected: MP3 -->
        <rect width="68" height="34" rx="10" fill="#EC4899"/>
        <text x="34" y="21" font-family="sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">✓ MP3</text>

        <!-- Unselected: WAV -->
        <rect x="76" width="68" height="34" rx="10" fill="#1F2937" stroke="#374151" stroke-width="1"/>
        <text x="110" y="21" font-family="sans-serif" font-size="12" font-weight="500" fill="#D1D5DB" text-anchor="middle">WAV</text>

        <!-- Unselected: AAC -->
        <rect x="152" width="64" height="34" rx="10" fill="#1F2937" stroke="#374151" stroke-width="1"/>
        <text x="184" y="21" font-family="sans-serif" font-size="12" font-weight="500" fill="#D1D5DB" text-anchor="middle">AAC</text>

        <!-- Unselected: M4A -->
        <rect x="224" width="64" height="34" rx="10" fill="#1F2937" stroke="#374151" stroke-width="1"/>
        <text x="256" y="21" font-family="sans-serif" font-size="12" font-weight="500" fill="#D1D5DB" text-anchor="middle">M4A</text>
      </g>
    </g>

    <!-- Preset Kualitas Output -->
    <g transform="translate(24, 370)">
      <text font-family="sans-serif" font-size="12" font-weight="700" fill="#E5E7EB">Preset Kualitas Output</text>
      
      <g transform="translate(0, 14)">
        <rect width="110" height="32" rx="10" fill="#312E81" stroke="#6366F1" stroke-width="1.2"/>
        <text x="55" y="20" font-family="sans-serif" font-size="11" font-weight="700" fill="#A5B4FC" text-anchor="middle">Tinggi (Default)</text>

        <rect x="118" width="105" height="32" rx="10" fill="#182234" stroke="#374151" stroke-width="1"/>
        <text x="170" y="20" font-family="sans-serif" font-size="11" font-weight="500" fill="#9CA3AF" text-anchor="middle">Seimbang</text>

        <rect x="231" width="120" height="32" rx="10" fill="#182234" stroke="#374151" stroke-width="1"/>
        <text x="291" y="20" font-family="sans-serif" font-size="11" font-weight="500" fill="#9CA3AF" text-anchor="middle">Hemat Ukuran</text>
      </g>
    </g>

    <!-- Big Action Button (Mulai Konversi) -->
    <g transform="translate(20, 440)">
      <rect width="360" height="54" rx="18" fill="url(#btnGrad)"/>
      <text x="180" y="34" font-family="sans-serif" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">
        Mulai Konversi (3 Berkas) →
      </text>
    </g>

    <!-- Dismiss Text / Cancel -->
    <text x="200" y="525" font-family="sans-serif" font-size="12" font-weight="600" fill="#9CA3AF" text-anchor="middle">
      Batal
    </text>
  </g>
</svg>