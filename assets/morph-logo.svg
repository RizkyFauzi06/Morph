<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#DB2777"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#4F46E5" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Container Squircle with shadow -->
  <rect x="15" y="15" width="130" height="130" rx="34" fill="url(#bgGrad)" filter="url(#shadow)"/>
  
  <!-- Accent overlay (top-right corner) -->
  <path d="M80,15 h35 c17.67,0 30,12.33 30,30 v35 c0,0 -30,0 -65,-30 c-5,-5 0,-35 0,-35 z" fill="url(#accentGrad)" opacity="0.95"/>
  <circle cx="115" cy="45" r="28" fill="url(#accentGrad)" opacity="0.75"/>

  <!-- Logo M (Signature Morph Stroke) -->
  <path d="M46,108 L46,56 L80,90 L114,56 L114,108" 
        stroke="#FFFFFF" 
        stroke-width="12" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        fill="none"/>
</svg>